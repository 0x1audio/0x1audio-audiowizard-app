[project]
name = "audiowizard"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "numpy>=2.1",
  "soxr>=0.5",
  "pedalboard>=0.9.26",
  "imageio-ffmpeg>=0.6",
]

[dependency-groups]
dev = [
  "soundfile>=0.13",
  "ox1audio",
]

[tool.uv.sources]
ox1audio = { path = "../0x1audio-sdk-py" }
