# Every commit in a pull request carries a Signed-off-by line from its author
# (CONTRIBUTING.md, "Sign off your commits"). No app to install and no secret:
# the job reads the commits and nothing else.
#
# Actions are pinned by commit SHA (the tag is in the comment).
name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  signed-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: sh .github/dco-check.sh "$BASE" "$HEAD"
